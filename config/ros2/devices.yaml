# Device table of the policy client.
# Every device is one topic; adding or removing an entry changes the topology
# without touching any code. Keys are the device names used in observations and
# in targets.
# Optional key `model_field` renames the device on the wire only; leave it out
# to send the device name itself. Field names must be unique across cameras and
# arms. Example:
#   fixed:
#     type: camera
#     model_field: cam_fixed
cameras:
  fixed:
    type: camera
    color_topic: fixed/image_color_raw
    depth_topic: fixed/image_depth_raw
    crop_mode: cover
    resize_w: 128
    resize_h: 128
    jpeg_quality: 90
  left_wrist:
    type: camera
    color_topic: left_wrist/image_color_raw
    crop_mode: cover
    resize_w: 128
    resize_h: 128
    jpeg_quality: 90
  right_wrist:
    type: camera
    color_topic: right_wrist/image_color_raw
    crop_mode: cover
    resize_w: 128
    resize_h: 128
    jpeg_quality: 90

arms:
  left:
    type: arm
    state_topic: left/manip_state
    ctrl_topic: left/manip_ctrl
    # Model output [-1, 1] is mapped linearly onto this travel range.
    grip_limit: [0.0, 0.75]
    # Joint velocity and acceleration limits written into every command.
    lim_vel: 0.5
    lim_acc: 50.0
    # Gravity feed forward [N]; zero means no compensation.
    grav: [0.0, 0.0, 0.0]
  right:
    type: arm
    state_topic: right/manip_state
    ctrl_topic: right/manip_ctrl
    grip_limit: [0.0, 0.75]
    lim_vel: 0.5
    lim_acc: 50.0
    grav: [0.0, 0.0, 0.0]
