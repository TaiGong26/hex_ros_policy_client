cameras:
  overhead:
    ros_cfg:
      namespace: overhead
      subscribers:
        color_topic: image_color_raw
        depth_topic: null
    crop_mode: cover
    resize_w: 128
    resize_h: 128
    jpeg_quality: 90
  left_wrist:
    ros_cfg:
      namespace: left_wrist
      subscribers:
        color_topic: image_color_raw
        depth_topic: null
    crop_mode: cover
    resize_w: 128
    resize_h: 128
    jpeg_quality: 90
  right_wrist:
    ros_cfg:
      namespace: right_wrist
      subscribers:
        color_topic: image_color_raw
        depth_topic: null
    crop_mode: cover
    resize_w: 128
    resize_h: 128
    jpeg_quality: 90

arms:
  left:
    ros_cfg:
      namespace: left
      subscribers:
        state_topic: manip_state
      publishers:
        ctrl_topic: manip_ctrl

    arm_cfg:
      lim_vel: 0.5
      lim_acc: 50.0
      grav: [0.0, 0.0, -9.81]
      stable_position: [0.0, -1.5, 3.0, 0.0, 0.0, 0.0]
      kp: [50.0, 50.0, 50.0, 50.0, 20.0, 20.0]
      kd: [2.5, 2.5, 2.5, 2.5, 1.0, 1.0]
      
    grip_cfg:
      lim_pos: [0.0, 0.70]
      lim_vel: 1.0
      lim_eff: 1.0

  right:
    ros_cfg:
      namespace: right
      subscribers:
        state_topic: manip_state
      publishers:
        ctrl_topic: manip_ctrl

    arm_cfg:
      lim_vel: 0.5
      lim_acc: 50.0
      grav: [0.0, 0.0, -9.81]
      stable_position: [0.0, -1.5, 3.0, 0.0, 0.0, 0.0]
      kp: [50.0, 50.0, 50.0, 50.0, 20.0, 20.0]
      kd: [2.5, 2.5, 2.5, 2.5, 1.0, 1.0]

    grip_cfg:
      lim_pos: [0.0, 0.70]
      lim_vel: 1.0
      lim_eff: 1.0
